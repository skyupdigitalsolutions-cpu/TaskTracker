<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transport ERP — Project Tracker</title>
<style>
  :root {
    --bg: #f5f4f1;
    --surface: #ffffff;
    --surface-2: #f9f8f6;
    --border: rgba(0,0,0,0.09);
    --border-strong: rgba(0,0,0,0.15);
    --text: #0b0b0b;
    --text-2: #52514e;
    --text-3: #898781;
    --accent: #2a78d6;
    --accent-bg: #e6f1fb;
    --accent-text: #0c447c;
    --success: #1baf7a;
    --success-bg: #eaf3de;
    --success-text: #27500A;
    --danger: #e24b4a;
    --danger-bg: #fcebeb;
    --danger-text: #a32d2d;
    --warning-bg: #faeeda;
    --warning-text: #633806;
    --radius: 8px;
    --m1: #2a78d6; --m2a: #1baf7a; --m2b: #9b59b6; --m3: #eb6834; --m4: #4a3aa7; --m5: #eda100;
    --w1: #0C447C; --w1bg: #E6F1FB;
    --w2: #27500A; --w2bg: #EAF3DE;
    --w3: #633806; --w3bg: #FAEEDA;
    --w4: #712B13; --w4bg: #FAECE7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19; --surface: #242422; --surface-2: #2c2c2a;
      --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.15);
      --text: #f0efec; --text-2: #c3c2b7; --text-3: #898781;
      --accent-bg: #0c447c; --accent-text: #b5d4f4;
      --success-bg: #085041; --success-text: #9FE1CB;
      --danger-bg: #501313; --danger-text: #F7C1C1;
      --warning-bg: #412402; --warning-text: #FAC775;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }

  /* LOGIN */
  #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
  .login-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 420px; }
  .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
  .login-logo-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 16px; }
  .login-logo-name { font-size: 16px; font-weight: 600; }
  .login-logo-sub { font-size: 12px; color: var(--text-3); }
  .login-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .login-sub { font-size: 13px; color: var(--text-2); margin-bottom: 1.75rem; }
  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.5rem; }
  .role-card { border: 1.5px solid var(--border-strong); border-radius: var(--radius); padding: 12px; cursor: pointer; transition: all .15s; background: var(--surface-2); }
  .role-card:hover { border-color: var(--accent); background: var(--accent-bg); }
  .role-card.selected { border-color: var(--accent); background: var(--accent-bg); }
  .role-card .rc-dot { width: 10px; height: 10px; border-radius: 50%; margin-bottom: 8px; }
  .role-card .rc-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .role-card .rc-desc { font-size: 11px; color: var(--text-3); }
  .admin-card { grid-column: 1 / -1; }
  .login-btn { width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
  .login-btn:hover { opacity: .9; }
  .login-btn:disabled { opacity: .4; cursor: not-allowed; }
  .login-pass-wrap { display: none; margin-bottom: 1rem; }
  .login-pass-wrap.show { display: block; }
  .login-pass-lbl { font-size: 12px; color: var(--text-2); margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  .login-pass-lbl .chip { font-size: 11px; padding: 2px 8px; border-radius: 100px; font-weight: 600; }
  .login-pass-input { width: 100%; padding: 10px 12px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface-2); color: var(--text); font-size: 14px; margin-bottom: 6px; }
  .login-pass-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .login-err { font-size: 12px; color: var(--danger-text); min-height: 16px; }
  .login-back { font-size: 12px; color: var(--text-3); background: none; border: none; cursor: pointer; padding: 0; margin-top: 4px; text-decoration: underline; }

  /* APP SHELL */
  #appScreen { display: none; min-height: 100vh; flex-direction: column; }
  .topbar { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; gap: 12px; height: 54px; position: sticky; top: 0; z-index: 100; }
  .tb-logo { font-size: 15px; font-weight: 600; flex: 1; }
  .tb-logo span { color: var(--accent); }
  .tb-role-badge { font-size: 12px; padding: 4px 10px; border-radius: 100px; font-weight: 500; }
  .tb-btn { padding: 6px 12px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: transparent; cursor: pointer; font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 5px; }
  .tb-btn:hover { background: var(--surface-2); }
  .tb-btn.danger-btn { color: var(--danger-text); border-color: var(--danger); }
  .tb-btn.danger-btn:hover { background: var(--danger-bg); }

  /* MAIN LAYOUT */
  .app-body { padding: 1.5rem; max-width: 1100px; margin: 0 auto; width: 100%; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  .stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .sc-label { font-size: 11px; color: var(--text-3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .sc-val { font-size: 22px; font-weight: 600; }
  .sc-bar { height: 4px; background: var(--bg); border-radius: 100px; margin-top: 6px; overflow: hidden; }
  .sc-bar-f { height: 4px; border-radius: 100px; transition: width .4s; }

  /* BLOCKER PANEL */
  .blocker-panel { background: var(--surface); border: 0.5px solid var(--danger); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  .bp-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .bp-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .bp-badge { font-size: 11px; padding: 2px 8px; border-radius: 100px; background: var(--danger-bg); color: var(--danger-text); font-weight: 600; }
  .bp-list { display: flex; flex-direction: column; gap: 6px; }
  .bpi { background: var(--surface-2); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 10px; display: flex; align-items: flex-start; gap: 10px; }
  .bpi.res { border-color: var(--success); background: var(--success-bg); }
  .bpi-body { flex: 1; }
  .bpi-desc { font-size: 13px; line-height: 1.4; margin-bottom: 3px; }
  .bpi-desc.st { text-decoration: line-through; color: var(--text-3); }
  .bpi-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sev-pill { font-size: 10px; padding: 2px 7px; border-radius: 100px; font-weight: 600; }
  .sev-high { background: var(--danger-bg); color: var(--danger-text); }
  .sev-med { background: var(--warning-bg); color: var(--warning-text); }
  .sev-low { background: var(--success-bg); color: var(--success-text); }
  .res-pill { font-size: 10px; padding: 2px 7px; border-radius: 100px; background: var(--success-bg); color: var(--success-text); font-weight: 600; }
  .bpi-day { font-size: 10px; color: var(--text-3); white-space: nowrap; }
  .bp-empty { font-size: 13px; color: var(--text-3); text-align: center; padding: 1rem; }

  /* CONTROLS */
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
  .week-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .wtab { padding: 5px 13px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: transparent; cursor: pointer; font-size: 13px; color: var(--text-2); transition: all .15s; }
  .wtab.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-text); font-weight: 500; }
  .wtab:hover:not(.active) { background: var(--surface-2); }
  .sep { width: 1px; height: 20px; background: var(--border-strong); }
  .filter-grp { display: flex; gap: 4px; }
  .fbtn { padding: 4px 11px; border-radius: 100px; border: 0.5px solid var(--border); background: transparent; cursor: pointer; font-size: 12px; color: var(--text-2); }
  .fbtn.active { background: var(--surface-2); border-color: var(--border-strong); color: var(--text); font-weight: 500; }
  .fbtn:hover:not(.active) { background: var(--surface-2); }
  .fbtn.f-blocked { color: var(--danger-text); }
  .fbtn.f-blocked.active { background: var(--danger-bg); border-color: var(--danger); }

  /* DAY CARDS */
  .day-grid { display: flex; flex-direction: column; gap: 8px; }
  .day-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; overflow: hidden; transition: border-color .15s; }
  .day-card.has-blocker { border-color: var(--danger); }
  .day-card.no-access { opacity: .5; pointer-events: none; }
  .day-hd { display: flex; align-items: center; gap: 8px; padding: 11px 16px; cursor: pointer; user-select: none; }
  .day-hd:hover { background: var(--surface-2); }
  .day-num { font-size: 11px; color: var(--text-3); min-width: 42px; font-variant-numeric: tabular-nums; }
  .day-title { font-weight: 500; font-size: 14px; flex: 1; }
  .day-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .day-bar { width: 72px; height: 4px; background: var(--bg); border-radius: 100px; overflow: hidden; }
  .day-bar-f { height: 4px; border-radius: 100px; transition: width .3s; }
  .day-prog { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .blk-pill { font-size: 10px; padding: 2px 7px; border-radius: 100px; background: var(--danger-bg); color: var(--danger-text); font-weight: 600; }
  .wk-pill { font-size: 10px; padding: 2px 7px; border-radius: 100px; font-weight: 600; }
  .chev { font-size: 16px; color: var(--text-3); transition: transform .2s; display: inline-block; }
  .chev.open { transform: rotate(180deg); }

  /* DAY BODY */
  .day-body { display: none; border-top: 0.5px solid var(--border); padding: 0 16px 16px; }
  .day-body.open { display: block; }
  .inner-tabs { display: flex; border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin: 12px 0; width: fit-content; }
  .itab { padding: 6px 14px; font-size: 12px; cursor: pointer; border: none; background: transparent; color: var(--text-2); white-space: nowrap; }
  .itab.active { background: var(--surface-2); color: var(--text); font-weight: 500; }
  .itab.has-blocker { color: var(--danger-text); }

  /* MEMBER COLUMNS */
  .member-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .mcol { background: var(--surface-2); border-radius: var(--radius); padding: 10px 12px; }
  .mcol.my-col { border: 1.5px solid var(--accent); }
  .ml { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .ml-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ml-you { font-size: 9px; padding: 1px 5px; border-radius: 100px; background: var(--accent-bg); color: var(--accent-text); font-weight: 600; }
  .tlist { display: flex; flex-direction: column; gap: 3px; }
  .ti { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; padding: 2px 0; border-radius: 4px; }
  .ti.clickable { cursor: pointer; }
  .ti.clickable:hover { opacity: .8; }
  .tcb { width: 14px; height: 14px; border-radius: 3px; border: 0.5px solid var(--border-strong); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .tcb.done { background: var(--success); border-color: var(--success); }
  .tcb.done::after { content: '✓'; font-size: 9px; color: #fff; font-weight: 700; }
  .tcb.ro { background: var(--surface-2); cursor: default; }
  .ttxt { line-height: 1.4; color: var(--text-2); }
  .ti.is-done .ttxt { text-decoration: line-through; color: var(--text-3); }
  .ro-txt { font-size: 10px; color: var(--text-3); font-style: italic; margin-top: 4px; }

  /* PER-TASK PROGRESS + BLOCKERS */
  .ti-wrap { padding: 7px 0; border-bottom: 0.5px solid var(--border); }
  .ti-wrap:last-child { border-bottom: none; }
  .ti-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-bottom: 5px; }
  .ti-txt { font-size: 12px; color: var(--text-2); line-height: 1.4; }
  .ti-txt.done { color: var(--text-3); text-decoration: line-through; }
  .ti-bar-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .ti-bar { flex: 1; height: 5px; background: var(--bg); border-radius: 100px; overflow: hidden; }
  .ti-bar-f { height: 5px; border-radius: 100px; transition: width .25s; }
  .ti-pct { font-size: 10px; color: var(--text-3); min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .ti-status { font-size: 10px; color: var(--text-3); margin-bottom: 5px; }
  .ti-controls { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-bottom: 3px; }
  .ti-pbtn { font-size: 10px; padding: 2px 7px; border-radius: 100px; border: 0.5px solid var(--border-strong); background: transparent; cursor: pointer; color: var(--text-2); }
  .ti-pbtn.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .ti-pbtn:hover:not(.active) { background: var(--surface-2); }
  .ti-blk-btn { font-size: 10px; padding: 2px 8px; border-radius: 100px; border: 0.5px solid var(--danger); color: var(--danger-text); background: transparent; cursor: pointer; margin-left: auto; white-space: nowrap; }
  .ti-blk-btn:hover { background: var(--danger-bg); }
  .ti-blk-badge { font-size: 9px; padding: 1px 6px; border-radius: 100px; background: var(--danger-bg); color: var(--danger-text); font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .ti-blk-form { background: var(--danger-bg); border: 0.5px solid var(--danger); border-radius: 6px; padding: 7px; margin: 4px 0; }
  .ti-blk-form .bf-row { margin-bottom: 5px; }
  .ti-blk-list { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .ti-blk-item { background: var(--surface); border: 0.5px solid var(--danger); border-radius: 6px; padding: 5px 8px; font-size: 11px; }
  .ti-blk-item.resolved { border-color: var(--success); background: var(--success-bg); }
  .tbi-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .tbi-desc.st { text-decoration: line-through; color: var(--text-3); }

  /* SYNC + HISTORY PANEL */
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block; margin-right: 4px; transition: background .2s; }
  .sync-dot.busy { background: var(--warn, #d99a2b); animation: pulse 1s infinite; }
  .sync-dot.err { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .hist-panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
  .hist-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .hist-title { font-size: 13px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .hist-filter { font-size: 12px; padding: 5px 8px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface-2); color: var(--text); }
  .hist-list { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; }
  .hist-item { display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px; border-radius: 6px; background: var(--surface-2); font-size: 12px; }
  .hist-icon { flex-shrink: 0; width: 18px; text-align: center; }
  .hist-body { flex: 1; min-width: 0; }
  .hist-actor { font-weight: 600; color: var(--text); }
  .hist-detail { color: var(--text-2); }
  .hist-meta { color: var(--text-3); font-size: 10px; margin-top: 2px; }
  .hist-empty { font-size: 12px; color: var(--text-3); text-align: center; padding: 20px 0; }

  /* GATE */
  .gate { margin-top: 12px; background: var(--success-bg); border: 0.5px solid; border-color: #9FE1CB; border-radius: var(--radius); padding: 8px 10px; }
  .gate-lbl { font-size: 11px; font-weight: 600; color: var(--success-text); margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
  .gate-items { display: flex; flex-wrap: wrap; gap: 3px; }
  .gi { font-size: 11px; color: var(--success-text); }
  .gi::before { content: '■ '; }

  /* BLOCKERS SECTION */
  .blockers-sec { margin-top: 4px; }
  .bsec-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .bsec-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .add-blk-btn { font-size: 12px; padding: 4px 10px; border-radius: var(--radius); border: 0.5px solid var(--danger); color: var(--danger-text); background: transparent; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .add-blk-btn:hover { background: var(--danger-bg); }
  .blk-form { background: var(--danger-bg); border: 0.5px solid var(--danger); border-radius: var(--radius); padding: 10px; margin-bottom: 10px; }
  .bf-row { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .bf-inp { flex: 1; min-width: 120px; font-size: 12px; padding: 6px 8px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface); color: var(--text); }
  .bf-sel { font-size: 12px; padding: 6px 8px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface); color: var(--text); }
  .bf-btns { display: flex; gap: 6px; }
  .bf-save { font-size: 12px; padding: 5px 14px; border-radius: var(--radius); border: none; background: var(--danger); color: #fff; cursor: pointer; font-weight: 500; }
  .bf-cancel { font-size: 12px; padding: 5px 10px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: transparent; color: var(--text-2); cursor: pointer; }
  .bf-err { font-size: 11px; color: var(--danger-text); margin-top: 4px; min-height: 14px; }
  .blk-list { display: flex; flex-direction: column; gap: 6px; }
  .blk-item { background: var(--surface-2); border: 0.5px solid var(--danger); border-radius: var(--radius); padding: 8px 10px; }
  .blk-item.resolved { border-color: var(--success); background: var(--success-bg); }
  .blk-top { display: flex; align-items: flex-start; gap: 8px; }
  .blk-body { flex: 1; }
  .blk-desc { font-size: 13px; line-height: 1.4; margin-bottom: 4px; }
  .blk-desc.st { text-decoration: line-through; color: var(--text-3); }
  .blk-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .blk-owner { font-size: 11px; color: var(--text-2); }
  .blk-date { font-size: 10px; color: var(--text-3); }
  .blk-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  .blk-btn { font-size: 11px; padding: 3px 8px; border-radius: var(--radius); border: 0.5px solid var(--border); background: transparent; cursor: pointer; color: var(--text-2); }
  .blk-btn:hover { background: var(--surface); }
  .blk-btn.res { color: var(--success-text); border-color: var(--success); }
  .blk-btn.res:hover { background: var(--success-bg); }
  .blk-btn.del { color: var(--danger-text); }
  .blk-empty { font-size: 12px; color: var(--text-3); padding: 10px; text-align: center; border: 0.5px dashed var(--border-strong); border-radius: var(--radius); }

  /* FOOTER */
  .footer { text-align: center; padding: 2rem; font-size: 12px; color: var(--text-3); }

  /* READONLY NOTICE */
  .ro-notice { font-size: 12px; background: var(--warning-bg); color: var(--warning-text); padding: 6px 12px; border-radius: var(--radius); margin-bottom: 1rem; display: flex; align-items: center; gap: 6px; }

  @media (max-width: 600px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .app-body { padding: 1rem; }
    .day-meta { gap: 5px; }
    .day-bar { width: 50px; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">SE</div>
      <div>
        <div class="login-logo-name">SkyUp Digital</div>
        <div class="login-logo-sub">Transport ERP Tracker</div>
      </div>
    </div>
    <div class="login-title">Select your role</div>
    <div class="login-sub">Choose your team role to view and manage your assigned tasks. Mobile is split: M2A = Customer App, M2B = Driver App.</div>
    <div class="role-grid" id="roleGrid"></div>
    <div class="login-pass-wrap" id="loginPassWrap">
      <div class="login-pass-lbl">

/* ---------- STORAGE (shared, via API + D1) ---------- */
function setSyncStatus(status) {
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  if (!dot || !label) return;
  dot.classList.remove('busy','err');
  if (status === 'busy') { dot.classList.add('busy'); label.textContent = 'Saving…'; }
  else if (status === 'err') { dot.classList.add('err'); label.textContent = 'Save failed'; }
  else { label.textContent = 'Synced'; }
}
function fmtDate(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); } catch(e) { return ''; }
}
async function hydrateStateFromServer() {
  try {
    const res = await fetch('/api/state');
    if (!res.ok) throw new Error('API error ' + res.status);
    const data = await res.json();
    const next = {};
    // preserve local-only UI state (which day cards are expanded) across re-hydration
    Object.keys(state).forEach(k => { if (k.startsWith('_open_')) next[k] = state[k]; });
    (data.taskProgress||[]).forEach(r => { next[tkey(r.day, r.member, r.task)] = r.progress; });
    (data.dayBlockers||[]).forEach(r => {
      const k = bkey(r.day);
      if (!next[k]) next[k] = [];
      next[k].push({ id:r.id, desc:r.desc, owner:r.owner, sev:r.sev, resolved:!!r.resolved, date:fmtDate(r.created_at) });
    });
    (data.taskBlockers||[]).forEach(r => {
      const k = tbkey(r.day, r.member, r.task);
      if (!next[k]) next[k] = [];
      next[k].push({ id:r.id, desc:r.desc, sev:r.sev, resolved:!!r.resolved, date:fmtDate(r.created_at) });
    });
    state = next;
    setSyncStatus('ok');
    return true;
  } catch(e) {
    console.warn('Could not load shared state from server:', e);
    setSyncStatus('err');
    return false;
  }
}

/* ---------- KEYS ---------- */
function tkey(d,m,t){ return 'd'+d+'_'+m+'_'+t.replace(/[^a-zA-Z0-9]/g,'_'); }
function bkey(d){ return 'blockers_d'+d; }
function tbkey(d,m,t){ return 'tblk_'+tkey(d,m,t); }

async function doLogin() {
  if (!currentRole) return;
  const passInput = document.getElementById('loginPassInput');
  const err = document.getElementById('loginErr');
  const loginBtn = document.getElementById('loginBtn');
  if (passInput.value !== currentRole.password) {
    err.textContent = 'Incorrect password. Try again.';
    passInput.value = '';
    passInput.focus();
    return;
  }
  err.textContent = '';
  loginBtn.disabled = true;
  loginBtn.textContent = 'Loading shared data…';
  const ok = await hydrateStateFromServer();
  loginBtn.textContent = 'Continue';
  loginBtn.disabled = false;
  if (!ok) {
    err.textContent = 'Could not reach the shared server. Check your connection and try again.';
    return;
  }
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
  const badge = document.getElementById('topRoleBadge');
  badge.textContent = currentRole.label;
  badge.style.background = currentRole.color + '20';
  badge.style.color = currentRole.color;
  badge.style.border = '0.5px solid ' + currentRole.color + '40';

    document.getElementById('roNotice').innerHTML = `<div class="ro-notice">👁 View-only access — you can see every member's tasks, progress and blockers, but cannot edit them.</div>`;

    document.getElementById('roNotice').innerHTML = `<div class="ro-notice">👁 You can view all tasks but can only check off your own (${currentRole.members.join(', ')}) tasks.</div>`;
  }
  render();
}

/* ---------- PROGRESS (per-task %) ---------- */
function getTaskProgress(d,m,t){ return state[tkey(d,m,t)] || 0; }
async function setTaskProgress(d,m,t,val) {
  if (!currentRole) return;
  if (!currentRole.canEdit.includes(m)) return;
  const k = tkey(d,m,t);
  const prev = state[k];
  state[k] = val;
  render();
  setSyncStatus('busy');
  try {
    const res = await fetch('/api/task-progress', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ day:d, member:m, task:t, value:val, actor:currentRole.id, actorLabel:currentRole.label })
    });
    if (!res.ok) throw new Error('save failed');
    setSyncStatus('ok');
  } catch(e) {
    console.error(e);
    setSyncStatus('err');
    state[k] = prev;
    render();
    alert('Could not save — check your connection and try again.');
  }
}
function dayProgress(day) {
  let total=0, sum=0, done=0;
  Object.entries(day.tasks).forEach(([m,tasks]) => {
    tasks.forEach(t => { total++; const v=getTaskProgress(day.d,m,t); sum+=v; if(v>=100) done++; });
  });
  return { total, done, sum, pct: total ? Math.round(sum/total) : 0 };
}
function weekProgress(w) {
  let total=0, sum=0;
  DAYS.filter(d=>d.w===w).forEach(d=>{ const p=dayProgress(d); total+=p.total; sum+=p.sum; });
  return { total, pct: total ? Math.round(sum/total) : 0 };
}
function totalProgress() {
  let total=0, sum=0;
  DAYS.forEach(d=>{ const p=dayProgress(d); total+=p.total; sum+=p.sum; });
  return { total, pct: total ? Math.round(sum/total) : 0 };
}

/* ---------- TASK-LEVEL BLOCKERS ---------- */
function taskBlockers(d,m,t){ return state[tbkey(d,m,t)] || []; }
function allTaskBlockersFlat() {
  let out = [];
  DAYS.forEach(day => {
    Object.entries(day.tasks).forEach(([m,tasks]) => {
      tasks.forEach(t => {
        taskBlockers(day.d,m,t).forEach(b => out.push({...b, day:day.d, dayTitle:day.title, member:m, task:t, isTask:true}));
      });
    });
  });
  return out;
}
function dayTaskBlockersOpenCount(day) {
  let n = 0;
  Object.entries(day.tasks).forEach(([m,tasks]) => {
    tasks.forEach(t => { n += taskBlockers(day.d,m,t).filter(b=>!b.resolved).length; });
  });
  return n;
}

/* ---------- RENDER STATS ---------- */

  let html = `<div class="stat-card"><div class="sc-label">Overall</div><div class="sc-val">${tp.pct}%</div><div class="sc-bar"><div class="sc-bar-f" style="width:${tp.pct}%;background:#2a78d6"></div></div></div>`;
  [1,2,3,4].forEach(w => {
    const wp = weekProgress(w);
    html += `<div class="stat-card"><div class="sc-label">Week ${w}</div><div class="sc-val">${wp.pct}%</div><div class="sc-bar"><div class="sc-bar-f" style="width:${wp.pct}%;background:${WBC[w]}"></div></div></div>`;

/* ---------- HISTORY PANEL ---------- */
function toggleHistoryPanel() {
  showHistoryPanel = !showHistoryPanel;
  if (showHistoryPanel) { loadHistory(); } else { render(); }
}
function changeHistoryDayFilter(val) {
  historyDayFilter = val;
  loadHistory();
}
async function loadHistory() {
  try {
    const url = historyDayFilter === 'all' ? '/api/history?limit=300' : `/api/history?day=${historyDayFilter}&limit=300`;
    const res = await fetch(url);
    const data = await res.json();
    historyCache = data.history || [];
  } catch(e) {
    console.error(e);
    historyCache = [];
  }
  render();
}
const HIST_ICON = {
  task_progress: '📊',
  day_blocker_add: '⚠', day_blocker_resolve: '✅', day_blocker_reopen: '↩️', day_blocker_delete: '🗑',
  task_blocker_add: '⚠', task_blocker_resolve: '✅', task_blocker_reopen: '↩️', task_blocker_delete: '🗑',
};
const HIST_VERB = {
  task_progress: 'updated progress on',
  day_blocker_add: 'added a blocker on Day', day_blocker_resolve: 'resolved a blocker on Day', day_blocker_reopen: 'reopened a blocker on Day', day_blocker_delete: 'deleted a blocker on Day',
  task_blocker_add: 'added a blocker on', task_blocker_resolve: 'resolved a blocker on', task_blocker_reopen: 'reopened a blocker on', task_blocker_delete: 'deleted a blocker on',
};
function histLine(h) {
  const dayTitle = (DAYS.find(d=>d.d===h.day)||{}).title || '';
  if (h.action === 'task_progress') {
    return `<b class="hist-actor">${h.actor_label}</b> updated <b>${h.member} — ${h.task}</b> <span class="hist-detail">(Day ${h.day}): ${h.detail}</span>`;
  }
  if (h.action.startsWith('day_blocker')) {
    return `<b class="hist-actor">${h.actor_label}</b> ${HIST_VERB[h.action]} ${h.day} — ${dayTitle}<span class="hist-detail">: ${h.detail}</span>`;
  }
  if (h.action.startsWith('task_blocker')) {
    return `<b class="hist-actor">${h.actor_label}</b> ${HIST_VERB[h.action]} <b>${h.member} — ${h.task}</b> <span class="hist-detail">(Day ${h.day}): ${h.detail}</span>`;
  }
  return `<b class="hist-actor">${h.actor_label}</b> ${h.action}`;
}
function renderHistoryPanel() {
  const wrap = document.getElementById('historyPanelWrap');
  if (!showHistoryPanel) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  const dayOptions = [`<option value="all">All days</option>`]
    .concat(DAYS.map(d => `<option value="${d.d}" ${historyDayFilter==String(d.d)?'selected':''}>Day ${d.d} — ${d.title}</option>`));
  wrap.innerHTML = `<div class="hist-panel">
    <div class="hist-hd">
      <div class="hist-title">🕓 Change history</div>
      <div style="display:flex;align-items:center;gap:8px;">

      </div>
    </div>
    <div class="hist-list">${historyCache.length ? historyCache.map(h => `
      <div class="hist-item">
        <div class="hist-icon">${HIST_ICON[h.action]||'•'}</div>
        <div class="hist-body">
          <div>${histLine(h)}</div>
          <div class="hist-meta">${new Date(h.ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>

}

/* ---------- RENDER DAYS ---------- */
function renderDays() {
  const filtered = DAYS.filter(day => {
    if (activeWeek > 0 && day.w !== activeWeek) return false;
    const ob = getBlockers(day.d).filter(b=>!b.resolved).length + dayTaskBlockersOpenCount(day);
    if (activeFilter === 'blocked') return ob > 0;
    if (activeFilter === 'complete') return dayProgress(day).pct === 100;
    if (activeFilter === 'incomplete') return dayProgress(day).pct < 100;
    return true;
  });
  document.getElementById('dayGrid').innerHTML = filtered.map(day => renderDay(day)).join('');
}

function renderDay(day) {
  const p = dayProgress(day);
  const isOpen = !!state['_open_'+day.d];
  const tab = dayInnerTab[day.d] || 'tasks';
  const blockers = getBlockers(day.d);
  const openB = blockers.filter(b=>!b.resolved).length;
  const openAll = openB + dayTaskBlockersOpenCount(day);
  const showAdd = !!addingBlocker[day.d];
  const wc = WKC[day.w];
  const members = Object.keys(day.tasks);

  // Check if this day has any tasks for current role
  const myMembers = currentRole ? currentRole.members : [];
  const hasMyTasks = members.some(m => myMembers.includes(m));

  /* TASKS TAB */
  const tasksHtml = `
    <div class="member-grid">
      ${members.map(m => {
        const tasks = day.tasks[m];
        const col = MC[m] || '#888';
        const isMyCol = myMembers.includes(m);
        const canEdit = currentRole && currentRole.canEdit.includes(m);
        return `<div class="mcol${isMyCol?' my-col':''}">
          <div class="ml">
            <span class="ml-dot" style="background:${col}"></span>
            ${m==='ALL'?'All members':m}
            ${isMyCol&&!currentRole.admin?`<span class="ml-you">You</span>`:''}
          </div>
          <div class="tlist">
            ${tasks.map(t => {
              const k = tkey(day.d,m,t);
              const safeT = t.replace(/'/g,"\\'");
              const val = getTaskProgress(day.d,m,t);
              const done = val >= 100;
              const tb = taskBlockers(day.d,m,t);
              const openTB = tb.filter(b=>!b.resolved).length;
              const showForm = !!addingTaskBlocker[k];
              return `<div class="ti-wrap">
                <div class="ti-top">
                  <span class="ti-txt${done?' done':''}">${t}</span>
                  ${openTB>0?`<span class="ti-blk-badge">⚠ ${openTB}</span>`:''}
                </div>
                <div class="ti-bar-row">
                  <div class="ti-bar"><div class="ti-bar-f" style="width:${val}%;background:${done?'var(--success)':col}"></div></div>
                  <span class="ti-pct">${val}%</span>
                </div>
                <div class="ti-status">${val}% completed · ${100-val}% incomplete</div>
                ${canEdit?`<div class="ti-controls">
                  ${[0,25,50,75,100].map(p=>`<button class="ti-pbtn${val===p?' active':''}" onclick="setTaskProgress(${day.d},'${m}','${safeT}',${p})">${p}%</button>`).join('')}
                  <button class="ti-blk-btn" onclick="startAddTaskBlocker('${k}')">⚠ + Blocker</button>
                </div>`:''}
                ${showForm?`<div class="ti-blk-form">
                  <div class="bf-row">
                    <input class="bf-inp" id="tbf_desc_${k}" placeholder="Describe the blocker" oninput="document.getElementById('tbf_err_${k}').textContent=''">
                    <select class="bf-sel" id="tbf_sev_${k}">
                      <option value="high">High</option>
                      <option value="med">Medium</option>
                      <option value="low">Low</option>
                    </select>
                  </div>
                  <div class="bf-btns">
                    <button class="bf-save" onclick="addTaskBlocker(${day.d},'${m}','${safeT}')">Save</button>
                    <button class="bf-cancel" onclick="cancelAddTaskBlocker('${k}')">Cancel</button>
                  </div>
                  <div class="bf-err" id="tbf_err_${k}"></div>
                </div>`:''}
                ${tb.length?`<div class="ti-blk-list">
                  ${tb.map(b=>`<div class="ti-blk-item${b.resolved?' resolved':''}">
                    <div class="tbi-row">
                      <span class="tbi-desc${b.resolved?' st':''}">${b.desc} <span class="sev-pill sev-${b.sev}" style="margin-left:4px">${b.sev}</span>${b.resolved?'<span class="res-pill" style="margin-left:4px">Resolved</span>':''}</span>
                      ${canEdit?`<span class="blk-actions">
                        <button class="blk-btn res" onclick="resolveTaskBlocker(${day.d},'${m}','${safeT}','${b.id}')">${b.resolved?'Reopen':'Resolve'}</button>
                        <button class="blk-btn del" onclick="deleteTaskBlocker(${day.d},'${m}','${safeT}','${b.id}')">✕</button>
                      </span>`:''}
                    </div>
                  </div>`).join('')}
                </div>`:''}
              </div>`;
            }).join('')}
          </div>
          ${!canEdit ? `<div class="ro-txt">View only</div>` : ''}
        </div>`;
      }).join('')}
    </div>
    <div class="gate">
      <div class="gate-lbl">✓ Completion gate</div>
      <div class="gate-items">${day.gate.map(g=>`<span class="gi">${g}</span>`).join('')}</div>
    </div>`;

  /* BLOCKERS TAB */
  const canManageDayBlockers = !currentRole.viewOnly;
  const blockersHtml = `<div class="blockers-sec">
    <div class="bsec-hd">
      <div class="bsec-title">⚠ Blockers ${openB>0?`<span class="blk-pill">${openB} open</span>`:''}</div>
      ${!showAdd && canManageDayBlockers?`<button class="add-blk-btn" onclick="startAdd(${day.d})">+ Add blocker</button>`:''}
    </div>
    ${showAdd?`<div class="blk-form">
      <div class="bf-row">
        <input class="bf-inp" id="bf_desc_${day.d}" placeholder="Describe the blocker" oninput="document.getElementById('bf_err_${day.d}').textContent=''">
        <input class="bf-inp" id="bf_owner_${day.d}" placeholder="Owner (M1–M5)" style="max-width:110px">
        <select class="bf-sel" id="bf_sev_${day.d}">
          <option value="high">High</option>
          <option value="med">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="bf-btns">
        <button class="bf-save" onclick="addBlocker(${day.d})">Save</button>
        <button class="bf-cancel" onclick="cancelAdd(${day.d})">Cancel</button>
      </div>
      <div class="bf-err" id="bf_err_${day.d}"></div>
    </div>`:''}
    <div class="blk-list">
      ${blockers.length ? blockers.map(b=>`
        <div class="blk-item${b.resolved?' resolved':''}">
          <div class="blk-top">
            <div class="blk-body">
              <div class="blk-desc${b.resolved?' st':''}">${b.desc}</div>
              <div class="blk-meta">

            </div>

              <button class="blk-btn res" onclick="resolveBlocker(${day.d},'${b.id}')">${b.resolved?'Reopen':'Resolve'}</button>

            </div>`:''}
          </div>
        </div>`).join('') : `<div class="blk-empty">No blockers on this day</div>`}
    </div>
  </div>`;

  return `<div class="day-card${openAll>0?' has-blocker':''}" id="dc${day.d}">

      <span class="day-title">${day.title}</span>
      <div class="day-meta">
        ${!hasMyTasks&&!currentRole.admin?`<span style="font-size:10px;color:var(--text-3);padding:2px 7px;border-radius:100px;border:0.5px solid var(--border)">Read only</span>`:''}

        <span class="day-prog">${p.done}/${p.total}</span>
        <div class="day-bar"><div class="day-bar-f" style="width:${p.pct}%;background:${WBC[day.w]}"></div></div>
        <span class="chev${isOpen?' open':''}">⌄</span>
      </div>
    </div>
    <div class="day-body${isOpen?' open':''}">
      <div class="inner-tabs">
        <button class="itab${tab==='tasks'?' active':''}" onclick="setInnerTab(${day.d},'tasks');event.stopPropagation()">Tasks (${p.done}/${p.total})</button>

      </div>
      ${tab==='tasks' ? tasksHtml : blockersHtml}
    </div>
  </div>`;
}

/* ---------- EXPORT ---------- */
function exportProgress() {
  let csv = 'Day,Title,Week,Type,Content,Member,Status\n';
  DAYS.forEach(day => {
    Object.entries(day.tasks).forEach(([m,tasks]) => {
      tasks.forEach(t => {
        csv += `${day.d},"${day.title}",${day.w},Task,"${t}",${m},${getTaskProgress(day.d,m,t)}% complete\n`;
        taskBlockers(day.d,m,t).forEach(b => {
          csv += `${day.d},"${day.title}",${day.w},TaskBlocker,"${t}: ${b.desc}","${m}/${b.sev}",${b.resolved?'Resolved':'Open'}\n`;
        });
      });
    });
    getBlockers(day.d).forEach(b => {
      csv += `${day.d},"${day.title}",${day.w},Blocker,"${b.desc}","${b.sev}/${b.owner||''}",${b.resolved?'Resolved':'Open'}\n`;
    });
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'transport_erp_progress.csv';
  a.click();
}

/* ---------- MAIN RENDER ---------- */
function render() {
  renderStats();
  renderBlockerPanel();
  renderHistoryPanel();
  renderWeekTabs();
  renderDays();
}
